name: contrato
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contrato-mock-conformidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Lint do contrato, exemplos válidos, artefatos gerados em dia e typecheck.
      - run: pnpm verificar
      - name: Sobe o mock
        run: |
          pnpm mock > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4010/o/modelo-otorrino/v1/publico/saude && break; sleep 1; done
      - name: Conformidade — modelo-otorrino
        run: pnpm conformidade
      - name: Conformidade — fisio-movimento
        run: pnpm conformidade
        env: { CONF_SLUG: fisio-movimento, CONF_GESTOR_EMAIL: pedro@fisio-movimento.exemplo, CONF_PACIENTE_EMAIL: fernanda@exemplo.com, CONF_PRIMEIRO_ACESSO_EMAIL: '' }
      - name: Conformidade — vet-amigo
        run: pnpm conformidade
        env: { CONF_SLUG: vet-amigo, CONF_GESTOR_EMAIL: renata@vet-amigo.exemplo, CONF_PACIENTE_EMAIL: laura@exemplo.com, CONF_PRIMEIRO_ACESSO_EMAIL: '' }
      - name: Frontend — unitários e build
        run: pnpm --filter frontend test && pnpm --filter frontend build
      - name: Frontend — E2E (FE0) contra o mock
        # Versão fixa: `npx playwright` sem versão quebrou quando a 1.65.0 saiu sem o playwright-core publicado.
        env: { PLAYWRIGHT_VERSAO: 1.56.1 }
        run: |
          npm install -g playwright@$PLAYWRIGHT_VERSAO
          npx -y playwright@$PLAYWRIGHT_VERSAO install --with-deps chromium
          pnpm --filter frontend dev > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5173 >/dev/null && break; sleep 1; done
          NODE_PATH=$(npm root -g) pnpm --filter frontend e2e
          NODE_PATH=$(npm root -g) pnpm --filter frontend e2e:a11y
      - name: Frontend — CSP no build de produção (homologação)
        run: |
          pnpm --filter frontend build:homologacao
          pnpm --filter frontend preview:homologacao > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173 >/dev/null && break; sleep 1; done
          NODE_PATH=$(npm root -g) pnpm --filter frontend e2e:csp
      - name: Mock sem violações de contrato
        run: '! grep -i "RESPOSTA FORA DO CONTRATO" mock.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: conformidade, path: "conformidade/relatorio.*\nmock.log" }

  backend:
    # Backend de referência contra PostgreSQL 17 real: testes do backend (isolamento, eventos, jobs,
    # concorrência, Web Push), conformidade COMPLETA nas 3 organizações e o frontend real apontado para
    # ele só pelo endereço do diretório (critério de saída da F2). Storage local (S3/MinIO: teste próprio depois).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://clinica_app:app_local@localhost:5432/clinica
      DATABASE_URL_DONO: postgres://clinica_dono:dono_local@localhost:5432/clinica
      PORT: 4020
      URL_PUBLICA: http://localhost:4020
      EMAIL: log
      MODO_TESTE_CODIGO_EMAIL: '123456'
      MODO_TESTE_TOTP: '000000'
      ANTIVIRUS_URL: teste  # verificador EICAR (ADR-0017); o protocolo clamd é testado em testes/antivirus.test.ts
      VALIDAR_RESPOSTA: '1'
      STORAGE_DIR: /tmp/clinica-arquivos
      CONF_DIRETORIO_URL: http://localhost:4020/diretorio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Banco — papéis, migrations e organizações
        working-directory: backend
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/papeis.sql
          pnpm migrar
          pnpm org:criar --todos
      - name: Backend — isolamento, eventos, jobs, concorrência e push
        working-directory: backend
        run: LOG_LEVEL=warn pnpm test
      - name: Sobe o backend (API + worker de jobs)
        working-directory: backend
        run: |
          pnpm start > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4020/diretorio/modelo-otorrino >/dev/null && break; sleep 1; done
      - name: Conformidade — modelo-otorrino
        run: pnpm conformidade
        env: { CONF_SLUG: modelo-otorrino }
      - name: Conformidade — fisio-movimento
        run: pnpm conformidade
        env: { CONF_SLUG: fisio-movimento, CONF_GESTOR_EMAIL: pedro@fisio-movimento.exemplo, CONF_PACIENTE_EMAIL: fernanda@exemplo.com, CONF_PRIMEIRO_ACESSO_EMAIL: '' }
      - name: Conformidade — vet-amigo
        run: pnpm conformidade
        env: { CONF_SLUG: vet-amigo, CONF_GESTOR_EMAIL: renata@vet-amigo.exemplo, CONF_PACIENTE_EMAIL: laura@exemplo.com, CONF_PRIMEIRO_ACESSO_EMAIL: '' }
      - name: Frontend real contra o backend real (só o endereço do diretório muda)
        env: { PLAYWRIGHT_VERSAO: 1.56.1, VITE_DIRETORIO_URL: 'http://localhost:4020/diretorio' }
        run: |
          npm install -g playwright@$PLAYWRIGHT_VERSAO
          npx -y playwright@$PLAYWRIGHT_VERSAO install --with-deps chromium
          pnpm --filter frontend dev > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5173 >/dev/null && break; sleep 1; done
          NODE_PATH=$(npm root -g) node frontend/e2e/backend-real.mjs
      - name: Backend sem violações de contrato nem erros
        run: |
          ! grep -i "RESPOSTA FORA DO CONTRATO" backend.log
          ! grep '"level":50' backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend, path: "conformidade/relatorio.*\nbackend.log" }

  backend-s3:
    # Mesmo backend com STORAGE=s3 (URLs pré-assinadas, recodificação, miniatura e limpeza da quarentena)
    # contra um S3 local (moto). Cobre o caminho de produção de arquivos que o job `backend` não exercita.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://clinica_app:app_local@localhost:5432/clinica
      DATABASE_URL_DONO: postgres://clinica_dono:dono_local@localhost:5432/clinica
      PORT: 4020
      URL_PUBLICA: http://localhost:4020
      EMAIL: log
      MODO_TESTE_CODIGO_EMAIL: '123456'
      MODO_TESTE_TOTP: '000000'
      ANTIVIRUS_URL: teste  # verificador EICAR (ADR-0017); o protocolo clamd é testado em testes/antivirus.test.ts
      VALIDAR_RESPOSTA: '1'
      STORAGE: s3
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: clinica
      AWS_ACCESS_KEY_ID: teste
      AWS_SECRET_ACCESS_KEY: teste
      CONF_DIRETORIO_URL: http://localhost:4020/diretorio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: S3 local (moto) e bucket
        working-directory: backend
        run: |
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q "moto[server]==5.1.4"
          /tmp/moto/bin/python -m moto.server -p 9000 > ../moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:9000 >/dev/null && break; sleep 1; done
          node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3');new S3Client({region:'us-east-1',endpoint:'http://localhost:9000',forcePathStyle:true}).send(new CreateBucketCommand({Bucket:'clinica'})).catch(e=>{console.error(e);process.exit(1)})"
      - name: Banco e backend
        working-directory: backend
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/papeis.sql
          pnpm migrar && pnpm org:criar --todos
          pnpm start > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4020/diretorio/modelo-otorrino >/dev/null && break; sleep 1; done
      - name: Conformidade de arquivos, check-in com foto e chat — S3
        run: pnpm conformidade testes/06-arquivos.test.ts testes/05-acompanhamento.test.ts testes/07-chat.test.ts
        env: { CONF_SLUG: modelo-otorrino }
      - name: Quarentena vazia e sem erros
        working-directory: backend
        run: |
          node -e "const {S3Client,ListObjectsV2Command}=require('@aws-sdk/client-s3');new S3Client({region:'us-east-1',endpoint:'http://localhost:9000',forcePathStyle:true}).send(new ListObjectsV2Command({Bucket:'clinica',Prefix:'quarentena/'})).then(r=>{const n=(r.Contents||[]).length;console.log('na quarentena:',n);process.exit(n?1:0)})"
          ! grep -i "RESPOSTA FORA DO CONTRATO" ../backend.log
          ! grep '"level":50' ../backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-s3, path: "conformidade/relatorio.*\nbackend.log" }
